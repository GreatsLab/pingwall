name: release

# Create a release yourself on GitHub (Releases -> Draft a new release,
# tag e.g. v0.4.0). This workflow then builds the binaries and attaches
# them to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: build
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            out=pingwall-${TAG}-${os}-${arch}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${TAG#v}" -o dist/$out .
          done
          cd dist && sha256sum * > SHA256SUMS
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
